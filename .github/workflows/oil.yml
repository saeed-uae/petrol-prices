name: Daily oil price

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  oil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get Brent price and build forecast
        run: |
          python3 - <<'EOF'
          import csv, io, json, time, datetime, urllib.request

          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36"}

          def get(url, timeout=120):
              req = urllib.request.Request(url, headers=UA)
              return urllib.request.urlopen(req, timeout=timeout).read().decode()

          def from_fred():
              text = get("https://fred.stlouisfed.org/graph/fredgraph.csv?id=DCOILBRENTEU")
              rows = []
              for r in csv.reader(io.StringIO(text)):
                  if len(r) < 2:
                      continue
                  try:
                      rows.append((datetime.date.fromisoformat(r[0]), float(r[1])))
                  except ValueError:
                      continue
              return rows

          def from_yahoo():
              text = get("https://query1.finance.yahoo.com/v8/finance/chart/BZ=F?range=6mo&interval=1d")
              res = json.loads(text)["chart"]["result"][0]
              rows = []
              for ts, v in zip(res["timestamp"], res["indicators"]["quote"][0]["close"]):
                  if v is not None:
                      rows.append((datetime.datetime.utcfromtimestamp(ts).date(), float(v)))
              return rows

          rows, source = [], ""
          for name, fn in [("FRED", from_fred), ("FRED", from_fred), ("FRED", from_fred), ("Yahoo", from_yahoo), ("Yahoo", from_yahoo)]:
              try:
                  rows = fn()
                  if len(rows) > 30:
                      source = name
                      break
              except Exception as e:
                  print(name, "failed:", e)
                  time.sleep(10)
          if not rows:
              raise SystemExit("All sources failed")

          rows = rows[-400:]
          last_d, last_v = rows[-1]
          prev_v = rows[-2][1]
          cur_m = (last_d.year, last_d.month)
          prev_m = (cur_m[0] - 1, 12) if cur_m[1] == 1 else (cur_m[0], cur_m[1] - 1)

          cur = [v for d, v in rows if (d.year, d.month) == cur_m]
          prv = [v for d, v in rows if (d.year, d.month) == prev_m]
          cur_avg = sum(cur) / len(cur)
          prev_avg = sum(prv) / len(prv)
          pct = (cur_avg - prev_avg) / prev_avg * 100

          if abs(pct) < 1:
              trend = "flat"
          elif pct > 0:
              trend = "up"
          else:
              trend = "down"
          strength = "strong" if abs(pct) >= 5 else "mild"

          out = {
              "date": last_d.isoformat(),
              "source": source,
              "brent": round(last_v, 2),
              "change": round(last_v - prev_v, 2),
              "month_avg": round(cur_avg, 2),
              "prev_month_avg": round(prev_avg, 2),
              "pct": round(pct, 1),
              "trend": trend,
              "strength": strength,
              "days": len(cur),
              "history": [round(v, 2) for d, v in rows if (d.year, d.month) == cur_m],
          }
          with open("oil.json", "w") as f:
              json.dump(out, f, indent=2)
          print(json.dumps(out, indent=2))
          EOF

      - name: Save
        run: |
          git config user.name "oil-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oil.json
          git diff --cached --quiet || (git commit -m "Update oil price" && git push)
