name: Update prices from form

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  update:
    if: github.event.issue.user.login == github.repository_owner && !contains(github.event.issue.labels.*.name, 'price-alert')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Update prices.json and history.json
        id: up
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          python3 -u - <<'EOF'
          import json, os, re, sys, datetime

          AR_MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"]
          KEYS = ["super98", "special95", "eplus91", "diesel"]
          NAMES = ["سوبر 98", "خصوصي 95", "إي بلس 91", "ديزل"]

          def finish(text, ok=False, new_month=False):
              open("result.txt", "w", encoding="utf-8").write(text)
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"ok={'true' if ok else 'false'}\n")
                  f.write(f"new_month={'true' if new_month else 'false'}\n")
              sys.exit(0)

          body = os.environ.get("BODY", "")
          vals = [p.strip() for p in re.split(r"^###\s.*$", body, flags=re.M)][1:]
          if len(vals) < 5:
              finish("❌ الفورم ناقص، عبّه مرة ثانية")

          month_name = vals[0]
          if month_name not in AR_MONTHS:
              finish("❌ الشهر غلط")

          tr = str.maketrans("٠١٢٣٤٥٦٧٨٩٫,", "0123456789..")
          prices = []
          for name, v in zip(NAMES, vals[1:5]):
              try:
                  x = float(v.translate(tr).strip())
              except ValueError:
                  finish(f"❌ الرقم غلط في {name}: {v}")
              if not 1 <= x <= 10:
                  finish(f"❌ الرقم مب منطقي في {name}: {v}")
              prices.append(round(x, 2))

          now = datetime.datetime.utcnow() + datetime.timedelta(hours=4)
          c = AR_MONTHS.index(month_name) + 1
          year = now.year + 1 if c < now.month - 1 else now.year
          month = f"{month_name} {year}"

          # ١. prices.json
          data = json.load(open("prices.json", encoding="utf-8"))
          new_month = data.get("month") != month
          if new_month:
              for k in KEYS:
                  data["prev_" + k] = data[k]
          data["month"] = month
          for k, p in zip(KEYS, prices):
              data[k] = p

          out = {"month": data["month"]}
          for k in KEYS:
              out[k] = data[k]
          for k in KEYS:
              if "prev_" + k in data:
                  out["prev_" + k] = data["prev_" + k]
          with open("prices.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, indent=2)

          # ٢. history.json (تاريخ الأسعار): نضيف الشهر أو نصلّحه
          key = f"{year}-{c:02d}"
          try:
              hist = json.load(open("history.json", encoding="utf-8"))
          except Exception:
              hist = {"months": []}
          months = [m for m in hist.get("months", []) if m.get("m") != key]
          months.append({"m": key, "p": prices})
          months.sort(key=lambda m: m["m"])
          hist["months"] = months
          with open("history.json", "w", encoding="utf-8") as f:
              json.dump(hist, f, ensure_ascii=False, separators=(",", ":"))

          lines = [f"✅ تم تحديث أسعار {month}", ""]
          for name, p in zip(NAMES, prices):
              lines.append(f"- {name}: {p:.2f}")
          lines.append("")
          lines.append("🔔 بيوصل إشعار للناس" if new_month else "🔕 نفس الشهر، تصليح بدون إشعار")
          finish("\n".join(lines), ok=True, new_month=new_month)
          EOF

      - name: Save
        if: steps.up.outputs.ok == 'true'
        run: |
          git config user.name "prices-bot"
          git config user.email "prices-bot@users.noreply.github.com"
          git add prices.json history.json
          git diff --cached --quiet || (git commit -m "Update prices" && git pull --rebase && git push)

      - name: Send notification
        if: steps.up.outputs.new_month == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run notify.yml --repo ${{ github.repository }}

      - name: Close price alerts
        if: steps.up.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --repo ${{ github.repository }} --label price-alert --state open --json number --jq '.[].number'); do
            gh issue close "$n" --repo ${{ github.repository }} --comment "✅ تم التحديث" || true
          done

      - name: Reply and close
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f result.txt ] || echo "❌ صار خطأ، شوف Actions" > result.txt
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file result.txt
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
